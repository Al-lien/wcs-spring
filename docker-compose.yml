services:
  wcs-postgres:
    container_name: wcs-container
    image: postgres:latest
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - wcs-volume:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - wcs-network

volumes:
  wcs-volume:

networks:
  wcs-network:
    driver: bridge
